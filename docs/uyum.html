<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zekai Suni — Şirket Uyum Takvimi</title><link rel="stylesheet" href="styles.css"><script>window.ZEKAI_STATIK=true;</script>
<script src="demo-veri.js"></script>
<script src="demo-kopru.js"></script>
</head><body>
<header class="ust-bar"><div class="marka">Şirket Uyum Takvimi <span class="cipy ornek">Örnek veri</span></div></header>
<section class="baslik-satir"><div><h1>Şirketler uyum yükümlülükleri</h1>
  <p class="ozet">Genel kurul, sicil, VERBİS, İYS — her yükümlülüğün hukuki dayanağı kayıtlı.</p></div></section>
<main id="liste"></main>
<footer class="feragat">Bu içerik hukuki görüş değildir; güvenilmeden önce bir avukat tarafından gözden geçirilmelidir.</footer>
<script src="nav.js"></script><script src="ortak.js"></script>
<script>let V=null;
async function yukle(){ V=await api("/api/uyum"); ciz(); }
function ciz(){
  const bugun=new Date(V.bugun);
  document.getElementById("liste").innerHTML=V.kayitlar.map(k=>{
    const gun=k.son_tarih?Math.ceil((new Date(k.son_tarih)-bugun)/86400000):null;
    const gecikti=gun!==null&&gun<0;
    return `<div class="sozlesme-satir" style="grid-template-columns:1fr 220px 170px;${gecikti?"border-left:4px solid var(--kirmizi)":""}">
     <div><div class="s-ad">${k.yukumluluk}</div><div class="s-alt">${k.sirket} · ${k.periyot}</div>
      <div class="alinti-kaynak">Dayanak: ${k.kaynak_hukum||"—"} · Sorumlu: ${k.sorumlu||"—"}</div></div>
     <div class="s-islem"><b>Son tarih:</b> ${trTarih(k.son_tarih)}
      ${gun!==null?`<div style="color:${gecikti?"var(--kirmizi)":"var(--ikinci)"}">${gecikti?Math.abs(gun)+" gün GECİKTİ":gun+" gün kaldı"}</div>`:""}</div>
     <div class="s-son-gun">${gecikti?rozet("Gecikti","kirmizi"):rozet("Planlandı","gri")}</div></div>`;}).join("");
}
yukle();
</script><script>window.GIRIS_MODUL="uyum";window.GIRIS_BASLIK="+ Yükümlülük ekle";window.GIRIS_ACIKLAMA="Şirket uyum yükümlülüğü ekleyin (genel kurul, VERBİS, İYS…). Hukuki dayanak kolonu kayda geçer.";window.GIRIS_ALANLARI=[{key:"sirket",etiket:"Şirket"},{key:"yukumluluk",etiket:"Yükümlülük"},{key:"periyot",etiket:"Periyot",tur:"select",secenekler:["Yıllık","Çeyreklik","Aylık","Tek seferlik"]},{key:"son_tarih",etiket:"Son tarih",tur:"date"},{key:"sorumlu",etiket:"Sorumlu"},{key:"kaynak_hukum",etiket:"Hukuki dayanak",ornek:"TTK m. 416"}];window.GIRIS_GONDER=async (v)=>{ await api("/api/giris/uyum/ekle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}); };window.GIRIS_GONDER_BASLIK="Yükümlülük ekle";</script>
<script src="giris.js"></script>
</body></html>
