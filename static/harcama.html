<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zekai Suni — Dış Büro Masraf Denetimi</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="ust-bar"><div class="marka">Dış Büro Masraf Denetimi <span class="cipy ornek">Örnek veri</span></div></header>
<section class="baslik-satir"><div><h1>Dış büro fatura denetimi</h1><p class="ozet" id="ozet"></p></div></section>
<main id="liste"></main>
<footer class="feragat">Bu içerik hukuki görüş değildir; güvenilmeden önce bir avukat tarafından gözden geçirilmelidir.</footer>
<script src="/static/nav.js"></script><script src="/static/ortak.js"></script>
<script>let V=null;
async function yukle(){ V=await api("/api/harcama"); ciz(); }
function ciz(){
  const o=V.ozet;
  document.getElementById("ozet").innerHTML=`Dönem toplamı <b>₺${o.toplam.toLocaleString("tr-TR")}</b> / bütçe ₺${o.butce.toLocaleString("tr-TR")} · <b style="color:var(--kirmizi)">${o.asisma.length} bütçe aşımı</b>`;
  document.getElementById("liste").innerHTML=V.kayitlar.map(k=>{
    const asim=k.butce&&k.tutar>k.butce;
    const yuzde=k.butce?Math.round(k.tutar/k.butce*100):null;
    return `<div class="sozlesme-satir" style="grid-template-columns:1fr 200px 180px;${asim?"border-left:4px solid var(--kirmizi)":""}">
     <div><div class="s-ad">${k.buro}</div><div class="s-alt">${k.dosya} · ${k.donem}</div>
      ${k.not_metin?`<div class="alinti-kaynak">${k.not_metin}</div>`:""}</div>
     <div class="s-islem"><b>₺${k.tutar.toLocaleString("tr-TR")}</b>${k.butce?` / bütçe ₺${k.butce.toLocaleString("tr-TR")}`:" (bütçe yok)"}
      ${yuzde!==null?`<div style="color:${asim?"var(--kirmizi)":"var(--yesil)"}">%${yuzde}${asim?" AŞIM":""}</div>`:""}</div>
     <div class="s-son-gun">${durumRozet(k.durum)}</div></div>`;}).join("");
}
yukle();
</script><script>window.GIRIS_MODUL="harcama";window.GIRIS_BASLIK="+ Fatura kaydı";window.GIRIS_ACIKLAMA="Dış büro faturasını kaydedin; bütçe girerseniz aşım otomatik işaretlenir.";window.GIRIS_ALANLARI=[{key:"buro",etiket:"Büro"},{key:"dosya",etiket:"Dosya/iş"},{key:"donem",etiket:"Dönem (YYYY-AA)",ornek:"2026-11"},{key:"tutar",etiket:"Tutar (TL)",tur:"number"},{key:"butce",etiket:"Bütçe (TL)",tur:"number"},{key:"not_metin",etiket:"Not",tur:"textarea"}];window.GIRIS_GONDER=async (v)=>{ await api("/api/giris/harcama/ekle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...v,durum:"Bekliyor"})}); };window.GIRIS_GONDER_BASLIK="Faturayı ekle";</script>
<script src="/static/giris.js"></script>
</body></html>
